services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rota
      POSTGRES_USER: rota
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Only reachable from this machine (handy for local development and backups).
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rota -d rota"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Rota: "Host=db;Port=5432;Database=rota;Username=rota;Password=${POSTGRES_PASSWORD}"
      Database__MigrateOnStartup: "true"
      Admin__Email: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      Admin__PasswordHash: ${ADMIN_PASSWORD_HASH:?set ADMIN_PASSWORD_HASH in .env}
      App__BaseUrl: ${APP_BASE_URL:-}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:-}
      App__TimeZone: ${TIME_ZONE:-Asia/Kuala_Lumpur}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  pgdata:
