name: CI

on:
  # Flow: feature branches → PR into staging (permanent; deploys to rota-staging) → PR from staging into master (production).
  push:
    branches: [master, staging]
    tags: ['v*']
  pull_request:

jobs:
  # Decides which jobs are relevant. Jobs that are not relevant are skipped, and GitHub reports a
  # skipped job as passing for required status checks (unlike workflow-level `paths:` filters, which
  # leave required checks pending forever). Tags (releases) always run everything.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.all.outputs.api == 'true' || steps.filter.outputs.api == 'true' }}
      web: ${{ steps.all.outputs.web == 'true' || steps.filter.outputs.web == 'true' }}
      docker: ${{ steps.all.outputs.docker == 'true' || steps.filter.outputs.docker == 'true' }}
    steps:
      - id: all
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "api=true" >> "$GITHUB_OUTPUT"; echo "web=true" >> "$GITHUB_OUTPUT"; echo "docker=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared: &shared
              - '.github/workflows/**'
            api:
              - *shared
              - 'api/**'
            web:
              - *shared
              - 'web/**'
            docker:
              - *shared
              - 'api/**'
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-compose.yml'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: api/global.json
      # Rota.Api.Tests starts a throwaway Postgres with Testcontainers (Docker is available on ubuntu runners).
      - run: dotnet test api/Rota.sln --configuration Release

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # master deploys the web app to Cloudflare Pages (Direct Upload project) once the tests pass; staging deploys to the
  # rota-staging project (rota-staging.zogami.uk, API rota-staging-api.zogami.uk) with the staging ribbon.
  # Secrets: CLOUDFLARE_API_TOKEN (Account → Cloudflare Pages → Edit), CLOUDFLARE_ACCOUNT_ID.
  # Variables (optional): VITE_API_URL, CLOUDFLARE_PAGES_PROJECT (production), STAGING_VITE_API_URL, STAGING_PAGES_PROJECT.
  pages:
    if: >-
      !cancelled() && github.event_name == 'push'
      && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/staging')
      && needs.changes.outputs.web == 'true'
      && needs.api.result != 'failure' && needs.web.result != 'failure'
    needs: [changes, api, web]
    runs-on: ubuntu-latest
    # One deploy per branch at a time; a newer push replaces a queued one.
    concurrency: pages-${{ github.ref_name }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: >-
            ${{ github.ref == 'refs/heads/staging'
              && (vars.STAGING_VITE_API_URL || 'https://rota-staging-api.zogami.uk')
              || (vars.VITE_API_URL || 'https://rota-api.zogami.uk') }}
          # Shows the staging ribbon. Production leaves it unset, so a missing value can never mark production as staging.
          VITE_APP_ENVIRONMENT: ${{ github.ref == 'refs/heads/staging' && 'staging' || '' }}
      # --branch must be the project's production branch, else it's a preview deploy:
      # main for the production project, staging for rota-staging (set in Pages → Settings → Production branch).
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: >-
            pages deploy dist --branch=${{ github.ref_name == 'staging' && 'staging' || 'main' }}
            --project-name=${{ github.ref == 'refs/heads/staging'
              && (vars.STAGING_PAGES_PROJECT || 'rota-staging')
              || (vars.CLOUDFLARE_PAGES_PROJECT || 'oncall-rota') }}

  # Pull requests only check the image builds. master, staging and v* tags push it to GHCR once the tests pass:
  # master → :latest and :sha-xxxxxxx, staging → :staging and :sha-xxxxxxx, tag v1.2.3 → :1.2.3 and :1.2.
  docker:
    if: >-
      !cancelled() && needs.changes.outputs.docker == 'true'
      && needs.api.result != 'failure' && needs.web.result != 'failure'
    runs-on: ubuntu-latest
    needs: [changes, api, web]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/staging' }}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
